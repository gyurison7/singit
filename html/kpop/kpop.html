<body>
	<div id="wrap">
		<!--==================
		* 페이지별 HEADER 구성이 다름에 따라 페이지별 클래스 추가 필요 (최상단 태그 id="container") 
		- PLAY 페이지 : play 클래스
		- SING 페이지 : sing 클래스
		- BATTLE 페이지 : battle 클래스
		- MY 페이지 : my 클래스
		- KPOP CONTEST 페이지 : kpop 클래스 
		- 서브 페이지 : sub 클래스 
        ======================-->
		<div id="container" class="kpop">
			<!--========== MODAL POPUP ==========-->
			<div class="modal-popup-group">

			</div>
			
			<!--========== HEADER ==========-->
			<header id="header"></header>
			<script>
				$(function () {
					$('#header').load("../include/header.html", function () {
						// 로드된 후에 실행될 코드
						$.getScript("../../asset/js/header.js");
					});
				});
			</script>
			<main id="main">
				<h2 class="main-title hidden">KPOP CONTEST</h2>
				<section class="section kpop-sec">
					<h3 class="section-title hidden">KPOP CONTEST</h3>
					<article class="section-content kpop-contest">
						<h4 class="hidden"><span>KPOP CONTEST 진행중</span></h4>
						<div class="inner kpop-cont-inner skeleton">
							<!--==================
								* 배너 이미지 작업시 유의사항 
									- 이벤트 상태 .status-label 제외하고 작업 필요(이미지로 상태 뱃지 작업시 태그 삭제 필요)
									- 비율 343 : 160 으로 작업 (사이즈 변경 필요시 kpop.css 비율 변경 필요)
							======================-->
							<div class="status-label round kpop">
								<span class="red">진행중</span>
							</div>
							<figure>
								<img class="fade-in lazyloaded" src="../../asset/images/sub/kpop/kpop-contest-banner01.jpg" alt="KPOP CONTEST 진행중">
							</figure>
						</div>
					</article>
					<article class="section-content kpop-progress">
						<h4 class="hidden"><span>KPOP CONTEST 예선 합격&패자 부활</span></h4>
						<div class="inner kpop-cont-inner skeleton">
							<!--==================
								* 배너 이미지 작업시 유의사항 
									- 이벤트 상태 .status-label 제외하고 작업 필요(이미지로 상태 뱃지 작업시 태그 삭제 필요)
									- 비율 343 : 120 으로 작업 (사이즈 변경 필요시 kpop.css 비율 변경 필요)
							======================-->
							<div class="status-label round kpop">
								<span class="blue">예선 합격 & 패자 부활</span>
							</div>
							<figure>
								<img class="fade-in lazyloaded" src="../../asset/images/sub/kpop/kpop-contest-banner02.jpg" alt="KPOP CONTEST 예선 합격 & 패자 부활">
							</figure>
						</div>
					</article>
					<article class="section-content kpop-vote">
						<h4 class="hidden"><span>KPOP CONTEST 투표중</span></h4>
						<div class="inner kpop-cont-inner skeleton">
							<!--==================
								* 배너 이미지 작업시 유의사항 
									- 이벤트 상태 .status-label 제외하고 작업 필요(이미지로 상태 뱃지 작업시 태그 삭제 필요)
									- 비율 343 : 120 으로 작업 (사이즈 변경 필요시 kpop.css 비율 변경 필요)
							======================-->
							<div class="status-label round kpop">
								<span class="gray">투표중</span>
							</div>
							<figure>
								<img class="fade-in lazyloaded" src="../../asset/images/sub/kpop/kpop-contest-banner03.jpg" alt="KPOP CONTEST 투표중">
							</figure>
						</div>
					</article>
					<article class="section-content kpop-win">
						<h4 class="hidden"><span>KPOP CONTEST 우승자 발표</span></h4>
						<div class="inner kpop-cont-inner skeleton">
							<!--==================
								* 배너 이미지 작업시 유의사항 
									- 이벤트 상태 .status-label 제외하고 작업 필요(이미지로 상태 뱃지 작업시 태그 삭제 필요)
									- 비율 343 : 120 으로 작업 (사이즈 변경 필요시 kpop.css 비율 변경 필요)
							======================-->
							<div class="status-label round kpop">
								<span class="yellow">우승자 발표</span>
							</div>
							<figure>
								<img class="fade-in lazyloaded" src="../../asset/images/sub/kpop/kpop-contest-banner03.jpg" alt="KPOP CONTEST 우승자 발표">
							</figure>
						</div>
					</article>
					<!-- 콘테스트 종료시 클래스 done 추가 -->
					<article class="section-content kpop-done done">
						<h4 class="hidden"><span>KPOP CONTEST 종료</span></h4>
						<div class="inner kpop-cont-inner skeleton">
							<div class="no-result">
								<p>콘테스트가 종료되었습니다.</p>
							</div>
							<!--==================
								* 배너 이미지 작업시 유의사항 
									- 이벤트 상태 .status-label 제외하고 작업 필요(이미지로 상태 뱃지 작업시 태그 삭제 필요)
									- 비율 343 : 120 으로 작업 (사이즈 변경 필요시 kpop.css 비율 변경 필요)
							======================-->
							<div class="status-label round kpop">
								<span class="dark">종료</span>
							</div>
							<figure>
								<img class="fade-in lazyloaded" src="../../asset/images/sub/kpop/kpop-contest-banner03.jpg" alt="KPOP CONTEST 종료">
							</figure>
						</div>
					</article>
				</section>

				<!-- Floating Button -->
				<aside id="singit-box" class="content-txt2">
