	<div id="wrap">

		* 페이지별 HEADER 구성이 다름에 따라 페이지별 클래스 추가 필요 (최상단 태그 id="container") 
		- PLAY 페이지 : play 클래스
		- SING 페이지 : sing 클래스
		- BATTLE 페이지 : battle 클래스
		- MY 페이지 : my 클래스
		- KPOP CONTEST 페이지 : kpop 클래스 
		- 서브 페이지 : sub 클래스 
        ======================-->
		<div id="container" class="kpop sub">
			<!--========== MODAL POPUP ==========-->
			<div class="modal-popup-group">

			</div>
			
			<!--========== HEADER ==========-->
			<header id="header"></header>
			<script>
				$(function () {
					$('#header').load("../include/header.html", function () {
						// 로드된 후에 실행될 코드
						$.getScript("../../asset/js/header.js");
					});
				});
			</script>
			<main id="main" class="sub">
				<h2 class="main-title hidden">K-TROT 콘테스트</h2>
				<section class="section ktrot-contest-sec">
					<h3 class="section-title hidden">K-TROT 콘테스트</h3>
					<div class="section-content">
						<figure class="skeleton">
							<!--==================
								* 배너 통이미지 작업시 유의사항 
									- 하단 여백 삽입 (여백 최소 사이즈 244px)
									- 이미지 사이즈 최대 가로 750px 기준으로 작업
							======================-->
							<img class="fade-in lazyloaded" src="../../asset/images/sub/kpop/ktrot-contest-banner.jpg" alt="K-TROT 콘테스트">
						</figure>
					</div>
				</section>
				<div class="btn-wrap bottom bg-none">
					<div class="inner">
						<button type="button" class="basic-btn red round sing" aria-label="참가하기" onclick="location.href='#none'">
							<span>참가하기</span>
						</button>
					</div>
				</div>

				<!-- Floating Button -->
				<aside id="share-btn" class="content-txt2">
                    <a href="javascript:;" tabindex="0" title="공유하기"><span class="hidden">공유하기</span></a>		
                </aside>
			</main>

			<div class="full-popup-group">

			</div>
